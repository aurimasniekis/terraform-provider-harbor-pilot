version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G204 # tests run the server and terraform binaries they build
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, unparam]
      - path: internal/acctest/
        linters: [gosec, noctx]
formatters:
  enable: [gofmt]
