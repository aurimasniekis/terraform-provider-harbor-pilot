# Builds signed release artifacts in the layout the Terraform Registry
# expects. Publishing to the Registry is a separate, manual step.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      # The release notes are the tag's section of CHANGELOG.md; a tag without one fails here.
      - name: Release notes
        env:
          REF: ${{ github.ref_name }}
        run: |
          v=${REF#v}
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {f=1; next} f && /^## / {exit} f' CHANGELOG.md |
            sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no section for $v"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
