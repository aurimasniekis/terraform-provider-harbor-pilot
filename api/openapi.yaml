components:
  schemas:
    APITokenDTO:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        last_used_ip:
          type: string
        name:
          type: string
        prefix:
          description: Non-secret token prefix for identification (hpa_<prefix>_…).
          type: string
        revoked_at:
          format: date-time
          type: string
      required:
        - id
        - prefix
        - name
        - created_by
        - created_at
      type: object
    APITokenList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/APITokenDTO"
          type: array
      required:
        - items
      type: object
    AcceptInBody:
      additionalProperties: false
      properties:
        password:
          maxLength: 4096
          type: string
        purpose:
          enum:
            - invite
            - reset
          type: string
        token:
          maxLength: 128
          type: string
      required:
        - token
        - purpose
        - password
      type: object
    AccountHealthView:
      additionalProperties: false
      properties:
        account_id:
          type: string
        available:
          type: boolean
        billing:
          type: string
        name:
          type: string
        reason:
          type: string
        remaining:
          description: Fraction of the tightest known window left; null when unknown.
          format: double
          type:
            - number
            - "null"
        reset_at:
          format: date-time
          type:
            - string
            - "null"
        stale:
          type: boolean
        until:
          format: date-time
          type:
            - string
            - "null"
      required:
        - account_id
        - name
        - billing
        - available
        - reason
        - until
        - remaining
        - reset_at
        - stale
      type: object
    AccountQuotaView:
      additionalProperties: false
      properties:
        account_id:
          type: string
        buckets:
          items:
            $ref: "#/components/schemas/BucketView"
          type: array
      required:
        - account_id
        - buckets
      type: object
    AccountSpec:
      additionalProperties: false
      properties:
        allowed_models:
          description: Restrict to these provider model ids; empty = all models of the provider.
          items:
            type: string
          type: array
        billing:
          description: How usage on this account is paid for. Paid fallback rules use this.
          enum:
            - metered_api
            - subscription
            - free
            - local
          type: string
        credential_ref:
          description: env:NAME or file:/path. Alternative to the write-only 'credential' secret.
          type: string
        display_name:
          maxLength: 120
          type: string
        enabled:
          type: boolean
        labels:
          additionalProperties:
            type: string
          description: Free-form labels available to routing expressions as account.labels.
          type: object
        max_concurrency:
          description: Local concurrency cap enforced by reservations; 0 = unlimited.
          format: int64
          maximum: 10000
          minimum: 0
          type: integer
        provider_id:
          type: string
        requests_per_minute:
          description: Local request rate cap; 0 = unlimited.
          format: int64
          maximum: 1000000
          minimum: 0
          type: integer
      required:
        - provider_id
        - display_name
        - credential_ref
        - billing
        - allowed_models
        - max_concurrency
        - requests_per_minute
        - enabled
        - labels
      type: object
    ActivitySummary:
      additionalProperties: false
      properties:
        avg_ttft_ms:
          format: double
          type:
            - number
            - "null"
        by_harness:
          additionalProperties:
            format: int64
            type: integer
          type: object
        by_model:
          additionalProperties:
            format: int64
            type: integer
          type: object
        by_status:
          additionalProperties:
            format: int64
            type: integer
          type: object
        costs:
          description: Totals per currency and cost kind (never summed across kinds).
          items:
            $ref: "#/components/schemas/CostDTO"
          type: array
        fallbacks:
          description: Requests that needed more than one attempt.
          format: int64
          type: integer
        from:
          format: date-time
          type: string
        requests:
          format: int64
          type: integer
        telemetry_dropped:
          description: Records dropped under back-pressure since start (coverage gap).
          format: int64
          type: integer
        to:
          format: date-time
          type: string
        tokens:
          $ref: "#/components/schemas/Tokens"
        unknown_usage:
          description: Requests whose usage the upstream did not report.
          format: int64
          type: integer
      required:
        - from
        - to
        - requests
        - by_status
        - by_harness
        - by_model
        - tokens
        - costs
        - avg_ttft_ms
        - fallbacks
        - unknown_usage
        - telemetry_dropped
      type: object
    AdapterView:
      additionalProperties: false
      properties:
        adapter_version:
          type: string
        capabilities:
          additionalProperties:
            $ref: "#/components/schemas/CapabilityInfo"
          type: object
        credential_types:
          items:
            type: string
          type: array
        default_poll_interval_secs:
          format: int64
          type: integer
        display_name:
          type: string
        docs_urls:
          items:
            type: string
          type: array
        family:
          type: string
        id:
          type: string
        limitations:
          items:
            type: string
          type: array
        push_only:
          type: boolean
        requires_terms_ack:
          type: boolean
        tier:
          enum:
            - official
            - unofficial
            - client_reported
            - demo
          type: string
      required:
        - id
        - display_name
        - family
        - adapter_version
        - tier
        - credential_types
        - capabilities
        - limitations
        - docs_urls
        - default_poll_interval_secs
        - push_only
        - requires_terms_ack
      type: object
    AdaptersOutBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdapterView"
          type: array
      required:
        - items
      type: object
    AliasSpec:
      additionalProperties: false
      properties:
        alias_id:
          description: Target alias (chains are allowed; cycles are rejected).
          type: string
        description:
          maxLength: 500
          type: string
        pool_id:
          description: Target pool (exactly one of pool_id or alias_id).
          type: string
        required_capabilities:
          description: Capabilities every candidate must have in addition to what a request demands.
          items:
            type: string
          type: array
      required:
        - description
        - pool_id
        - alias_id
        - required_capabilities
      type: object
    AttemptDTO:
      additionalProperties: false
      properties:
        account_id:
          type: string
        duration_ms:
          format: int64
          type:
            - integer
            - "null"
        error_kind:
          type: string
        error_message:
          type: string
        executed:
          description: The upstream may have processed this attempt (never replayed).
          type: boolean
        failover_reason:
          type: string
        finished_at:
          format: date-time
          type: string
        http_status:
          format: int64
          type: integer
        id:
          type: string
        mode:
          type: string
        model:
          type: string
        "n":
          format: int64
          type: integer
        provider_id:
          type: string
        retry_after_s:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        status:
          type: string
        tokens:
          $ref: "#/components/schemas/Tokens"
        ttft_ms:
          format: int64
          type:
            - integer
            - "null"
        unknown_events:
          items:
            type: string
          type: array
        upstream_protocol:
          type: string
      required:
        - id
        - "n"
        - started_at
        - account_id
        - provider_id
        - model
        - upstream_protocol
        - mode
        - status
        - error_kind
        - error_message
        - executed
        - ttft_ms
        - duration_ms
        - failover_reason
        - tokens
        - unknown_events
      type: object
    AuditEntryDTO:
      additionalProperties: false
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_kind:
          type: string
        at:
          format: date-time
          type: string
        details: {}
        id:
          type: string
        ip:
          type: string
        outcome:
          type: string
        request_id:
          type: string
        target_id:
          type: string
        target_kind:
          type: string
      required:
        - id
        - at
        - actor_id
        - actor_kind
        - action
        - outcome
        - details
      type: object
    AuthSettingsDTO:
      additionalProperties: false
      properties:
        absolute_timeout_seconds:
          format: int64
          maximum: 2592000
          minimum: 300
          type: integer
        idle_timeout_seconds:
          format: int64
          maximum: 86400
          minimum: 300
          type: integer
        password_login:
          description: When false, only SSO (and break-glass recovery) can sign in.
          type: boolean
        revision:
          format: int64
          readOnly: true
          type: integer
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
        - password_login
        - idle_timeout_seconds
        - absolute_timeout_seconds
        - updated_at
        - revision
      type: object
    BackupDTO:
      additionalProperties: false
      properties:
        intact:
          type: boolean
        manifest:
          $ref: "#/components/schemas/Manifest"
        name:
          type: string
        path:
          type: string
        problem:
          type: string
      required:
        - name
        - path
        - intact
      type: object
    BackupInBody:
      additionalProperties: false
      properties:
        include_traces:
          description: Also back up encrypted trace content (excluded by default).
          type: boolean
      type: object
    BackupOutBody:
      additionalProperties: false
      properties:
        manifest:
          $ref: "#/components/schemas/Manifest"
        path:
          type: string
      required:
        - path
        - manifest
      type: object
    BindingLimits:
      additionalProperties: false
      properties:
        max_concurrency:
          description: 0 = unlimited.
          format: int64
          minimum: 0
          type: integer
        max_request_bytes:
          description: 0 = server default.
          format: int64
          minimum: 0
          type: integer
        requests_per_minute:
          description: 0 = unlimited.
          format: int64
          minimum: 0
          type: integer
      required:
        - requests_per_minute
        - max_concurrency
        - max_request_bytes
      type: object
    BindingSpec:
      additionalProperties: false
      properties:
        allowed_models:
          description: Requested model names (aliases or plan mappings) this client may use; empty = any the plan maps.
          items:
            type: string
          type: array
        allowed_project_ids:
          description: Projects a trusted project hint may select.
          items:
            type: string
          type: array
        display_name:
          maxLength: 120
          type: string
        enabled:
          type: boolean
        expected_harness:
          description: Informational; mismatches are recorded, never enforced as identity.
          enum:
            - claude_code
            - codex
            - opencode
            - pi
            - generic
            - ""
          type: string
        external_refs:
          additionalProperties:
            type: string
          description: Operator-configured trusted references.
          type: object
        limits:
          $ref: "#/components/schemas/BindingLimits"
        owner_id:
          description: usr_… or pri_… (empty when owner_kind is none).
          type: string
        owner_kind:
          description: Who is accountable for this client (empty = none).
          enum:
            - user
            - service
            - none
            - ""
          type: string
        plan_id:
          type: string
        project_id:
          description: Default project for attribution (optional).
          type: string
        trust:
          $ref: "#/components/schemas/BindingTrust"
      required:
        - display_name
        - owner_kind
        - owner_id
        - plan_id
        - project_id
        - allowed_project_ids
        - expected_harness
        - allowed_models
        - limits
        - trust
        - external_refs
        - enabled
      type: object
    BindingTrust:
      additionalProperties: false
      properties:
        intent_hints:
          description: Accept declared intent (X-HP-Intent) as trusted.
          type: boolean
        project_hints:
          description: Allow X-HP-Project to select one of allowed_project_ids.
          type: boolean
        session_hints:
          description: Use harness session headers to group requests into sessions.
          type: boolean
      required:
        - session_hints
        - project_hints
        - intent_hints
      type: object
    BoardBody:
      additionalProperties: false
      properties:
        account_health:
          items:
            $ref: "#/components/schemas/AccountHealthView"
          type: array
        dropped_observations:
          format: int64
          type: integer
        monitors:
          items:
            $ref: "#/components/schemas/MonitorView"
          type: array
        observed_accounts:
          description: Rate-limit state derived from gateway responses.
          items:
            $ref: "#/components/schemas/AccountQuotaView"
          type: array
      required:
        - monitors
        - observed_accounts
        - account_health
        - dropped_observations
      type: object
    BrOutBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Breaker"
          type: array
      required:
        - items
      type: object
    Breaker:
      additionalProperties: false
      properties:
        key:
          type: string
        last_class:
          type: string
        last_reason:
          type: string
        opened_at:
          format: date-time
          type:
            - string
            - "null"
        override:
          enum:
            - auto
            - force_open
            - force_closed
          type: string
        override_reason:
          type: string
        path:
          type: string
        provider_id:
          type: string
        recent_failures:
          format: int64
          type: integer
        retry_at:
          format: date-time
          type:
            - string
            - "null"
        state:
          enum:
            - closed
            - open
            - half_open
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - key
        - provider_id
        - path
        - state
        - override
        - opened_at
        - retry_at
        - recent_failures
        - updated_at
      type: object
    BridgeStatus:
      additionalProperties: false
      properties:
        binary:
          type: string
        enabled:
          type: boolean
        kind:
          type: string
        last_error:
          type: string
        version:
          type: string
      required:
        - kind
        - enabled
        - binary
        - version
      type: object
    BridgesOutBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/BridgeStatus"
          type: array
      required:
        - items
      type: object
    BucketView:
      additionalProperties: false
      properties:
        currency:
          type: string
        exhausted:
          type: boolean
        global:
          type: boolean
        key:
          type: string
        kind:
          type: string
        label:
          type: string
        limit:
          format: double
          type:
            - number
            - "null"
        limit_amount:
          type: string
        model:
          type: string
        observed_at:
          format: date-time
          type: string
        official:
          type: boolean
        quality:
          type: string
        remaining:
          format: double
          type:
            - number
            - "null"
        remaining_amount:
          type: string
        remaining_fraction:
          format: double
          type:
            - number
            - "null"
        reset_at:
          format: date-time
          type:
            - string
            - "null"
        reset_passed:
          type: boolean
        reset_semantics:
          type: string
        scope:
          type: string
        source:
          enum:
            - adapter
            - response_headers
            - cli_event
          type: string
        source_time:
          format: date-time
          type:
            - string
            - "null"
        stale:
          type: boolean
        unit:
          type: string
        used:
          format: double
          type:
            - number
            - "null"
        used_amount:
          type: string
        window_seconds:
          format: int64
          type: integer
      required:
        - key
        - label
        - scope
        - kind
        - unit
        - reset_semantics
        - global
        - official
        - source
        - limit
        - used
        - remaining
        - remaining_fraction
        - reset_at
        - source_time
        - observed_at
        - quality
        - stale
        - exhausted
        - reset_passed
      type: object
    BudOutBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/BudgetUsage"
          type: array
      required:
        - items
      type: object
    BudgetSpec:
      additionalProperties: false
      properties:
        cost_kinds:
          description: "Cost categories that count. Default: estimated_api_charge and actual_api_charge. list_equivalent (subscription usage priced at list rates) counts only when listed."
          items:
            type: string
          type: array
        currency:
          description: ISO currency; only costs in this currency count.
          type: string
        enabled:
          type: boolean
        enforcement:
          description: block rejects new attempts once the limit would be exceeded; warn only emits events.
          enum:
            - block
            - warn
          type: string
        limit:
          description: Decimal amount in currency.
          type: string
        period:
          enum:
            - day
            - week
            - month
          type: string
        scope:
          enum:
            - global
            - workspace
            - project
            - binding
            - account
          type: string
        scope_id:
          description: Id of the workspace, project, client binding or provider account. Empty for global.
          type: string
        timezone:
          description: IANA timezone for period boundaries. Empty = UTC.
          type: string
        warn_at:
          description: Fraction of the limit that emits a warning event. 0 = 0.8.
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
        - scope
        - period
        - limit
        - currency
        - enabled
      type: object
    BudgetUsage:
      additionalProperties: false
      properties:
        budget_id:
          type: string
        by_kind_e10:
          additionalProperties:
            format: int64
            type: integer
          type: object
        cost_kinds:
          items:
            type: string
          type: array
        currency:
          type: string
        enabled:
          type: boolean
        enforcement:
          type: string
        fraction:
          format: double
          type: number
        limit_e10:
          format: int64
          type: integer
        name:
          type: string
        period:
          type: string
        period_end:
          format: date-time
          type: string
        period_start:
          format: date-time
          type: string
        projected_spend_e10:
          format: int64
          type:
            - integer
            - "null"
        reserved_e10:
          format: int64
          type: integer
        scope:
          type: string
        scope_id:
          type: string
        spent_e10:
          format: int64
          type: integer
        state:
          enum:
            - ok
            - warning
            - exceeded
            - disabled
          type: string
        warn_at:
          format: double
          type: number
      required:
        - budget_id
        - name
        - scope
        - scope_id
        - period
        - period_start
        - period_end
        - currency
        - cost_kinds
        - enforcement
        - enabled
        - limit_e10
        - spent_e10
        - reserved_e10
        - by_kind_e10
        - fraction
        - warn_at
        - projected_spend_e10
        - state
      type: object
    BulkOutBody:
      additionalProperties: false
      properties:
        deleted:
          format: int64
          type: integer
      required:
        - deleted
      type: object
    Bundle:
      additionalProperties: false
      properties:
        api_version:
          type: string
        config_revision:
          format: int64
          type: integer
        exported_at:
          format: date-time
          type: string
        plans:
          items:
            $ref: "#/components/schemas/BundlePlan"
          type: array
        resources:
          items:
            $ref: "#/components/schemas/BundleResource"
          type: array
      required:
        - api_version
        - exported_at
        - config_revision
        - resources
        - plans
      type: object
    BundlePlan:
      additionalProperties: false
      properties:
        plan:
          type: string
        published: {}
        version:
          format: int64
          type: integer
      required:
        - plan
        - version
        - published
      type: object
    BundleResource:
      additionalProperties: false
      properties:
        kind:
          type: string
        managed_by:
          type: string
        name:
          type: string
        secrets:
          additionalProperties:
            $ref: "#/components/schemas/SecretInfo"
          description: Presence only; values are never exported.
          type: object
        spec: {}
      required:
        - kind
        - name
        - spec
      type: object
    Candidate:
      additionalProperties: false
      properties:
        account:
          type: string
        account_id:
          type: string
        billing:
          type: string
        health:
          $ref: "#/components/schemas/Health"
        model:
          type: string
        native:
          type: boolean
        priority:
          format: int64
          type: integer
        provider:
          type: string
        provider_id:
          type: string
        reasons:
          items:
            type: string
          type: array
        score:
          format: double
          type: number
        upstream_protocol:
          type: string
        weight:
          format: int64
          type: integer
      required:
        - provider_id
        - provider
        - account_id
        - account
        - model
        - billing
        - upstream_protocol
        - native
        - priority
        - weight
        - score
        - reasons
      type: object
    CapabilityInfo:
      additionalProperties: false
      properties:
        note:
          type: string
        status:
          enum:
            - supported
            - partial
            - unsupported
            - unknown
          type: string
      required:
        - status
      type: object
    CatOutBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/KindInfo"
          type: array
      required:
        - items
      type: object
    ChOutBody:
      additionalProperties: false
      properties:
        dropped:
          description: Signals dropped under pressure; coverage is reduced when non-zero.
          format: int64
          type: integer
        items:
          items:
            $ref: "#/components/schemas/Change"
          type: array
        processed:
          format: int64
          type: integer
      required:
        - items
        - processed
        - dropped
      type: object
    Change:
      additionalProperties: false
      properties:
        adapter_version:
          type: string
        client_harness:
          type: string
        client_version:
          type: string
        confidence:
          enum:
            - high
            - medium
            - low
          type: string
        count:
          format: int64
          type: integer
        detail: {}
        direction:
          type: string
        endpoint:
          type: string
        first_seen:
          format: date-time
          type: string
        id:
          type: string
        impact:
          enum:
            - breaking
            - additive
            - unknown
          type: string
        kind:
          type: string
        last_seen:
          format: date-time
          type: string
        path:
          type: string
        protocol:
          type: string
        provider_id:
          type: string
        recency:
          enum:
            - current
            - not_observed_recently
          type: string
      required:
        - id
        - kind
        - direction
        - protocol
        - provider_id
        - endpoint
        - adapter_version
        - client_harness
        - client_version
        - path
        - detail
        - confidence
        - impact
        - first_seen
        - last_seen
        - count
        - recency
      type: object
    ChannelSpec:
      additionalProperties: false
      properties:
        allow_private_network:
          type: boolean
        api_base_url:
          type: string
        digest_minutes:
          format: int64
          maximum: 1440
          minimum: 0
          type: integer
        enabled:
          type: boolean
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
