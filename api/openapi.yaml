info:
  description: "Control-plane API for Harbor Pilot: configuration, routing plans, accounting, activity, traces, events and notifications. The gateway data plane (/v1/messages, /v1/chat/completions, /v1/responses, /v1beta/models) is documented separately."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Harbor Pilot API
  version: dev
openapi: 3.1.0
paths:
  /activity/requests:
    get:
      operationId: list-requests
      parameters:
        - description: Opaque cursor from a previous page's next_cursor.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous page's next_cursor.
            type: string
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: binding_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: project_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: session_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: account_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - in_progress
              - ok
              - error
              - blocked
              - canceled
              - ""
            type: string
        - explode: false
          in: query
          name: model
          schema:
            maxLength: 200
            type: string
        - explode: false
          in: query
          name: harness
          schema:
            maxLength: 32
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageRequestSummary"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: List gateway requests (newest first)
      tags:
        - Activity
      x-permission: activity.read
  /activity/requests/{id}:
    get:
      operationId: get-request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Request detail with routing explanation, attempts and accounting
      tags:
        - Activity
      x-permission: activity.read
  /activity/requests/{id}/replay:
    post:
      operationId: replay-request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResult"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Re-evaluate a recorded request's routing with its recorded inputs (no upstream call)
      tags:
        - Routing
      x-permission: activity.read
  /activity/sessions:
    get:
      operationId: list-sessions
      parameters:
        - description: Opaque cursor from a previous page's next_cursor.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous page's next_cursor.
            type: string
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: binding_id
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageObservedSession"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: List observed sessions (most recent first)
      tags:
        - Activity
      x-permission: activity.read
  /activity/summary:
    get:
      operationId: get-activity-summary
      parameters:
        - explode: false
          in: query
          name: hours
          schema:
            default: 24
            format: int64
            maximum: 720
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummary"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Aggregate recent activity
      tags:
        - Activity
      x-permission: activity.read
  /audit:
    get:
      operationId: list-audit-log
      parameters:
        - description: Opaque cursor from a previous page's next_cursor.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous page's next_cursor.
            type: string
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: Action prefix filter, e.g. auth. or trace.content
          explode: false
          in: query
          name: action
          schema:
            description: Action prefix filter, e.g. auth. or trace.content
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: target_kind
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: target_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: actor_id
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: outcome
          schema:
            enum:
              - success
              - denied
              - error
              - ""
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAuditEntryDTO"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Query the audit log (newest first)
      tags:
        - Audit
      x-permission: audit.read
  /auth/accept:
    post:
      operationId: accept-invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDTO"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security: []
      summary: Set a password from an invitation or reset token and sign in
      tags:
        - Session
      x-permission: public
  /auth/oidc-providers:
    get:
      operationId: list-oidc-providers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProviderList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: List SSO providers
      tags:
        - Single sign-on
      x-permission: auth.settings
    post:
      operationId: create-oidc-provider
      parameters:
        - in: header
          name: X-HP-Managed-By
          schema:
            enum:
              - ui
              - api
              - terraform
              - cli
              - import
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProviderDTO"
          description: Created
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Create an SSO provider
      tags:
        - Single sign-on
      x-permission: auth.settings
  /auth/oidc-providers/{id}:
    delete:
      operationId: delete-oidc-provider
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Delete an SSO provider (unlinks identities)
      tags:
        - Single sign-on
      x-permission: auth.settings
    get:
      operationId: get-oidc-provider
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProviderDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Get an SSO provider
      tags:
        - Single sign-on
      x-permission: auth.settings
    put:
      operationId: replace-oidc-provider
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
        - in: header
          name: If-Match
          schema:
            type: string
        - in: header
          name: X-HP-Managed-By
          schema:
            enum:
              - ui
              - api
              - terraform
              - cli
              - import
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCProviderDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Replace an SSO provider
      tags:
        - Single sign-on
      x-permission: auth.settings
  /auth/oidc-providers/{id}/test:
    post:
      operationId: test-oidc-provider
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkOutBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Start a test sign-in that reports mapped claims without signing in
      tags:
        - Single sign-on
      x-permission: auth.settings
  /auth/oidc-test-results/{rid}:
    get:
      operationId: get-oidc-test-result
      parameters:
        - in: path
          name: rid
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestOutBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Fetch the outcome of a test sign-in (valid 10 minutes)
      tags:
        - Single sign-on
      x-permission: auth.settings
  /auth/oidc/callback:
    get:
      operationId: oidc-callback
      parameters:
        - explode: false
          in: query
          name: code
          schema:
            maxLength: 2048
            type: string
        - explode: false
          in: query
          name: state
          schema:
            maxLength: 256
            type: string
        - explode: false
          in: query
          name: iss
          schema:
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: error
          schema:
            maxLength: 128
            type: string
        - explode: false
          in: query
          name: error_description
          schema:
            maxLength: 512
            type: string
        - in: cookie
          name: __Host-hp_oidc
          schema:
            type: string
        - in: cookie
          name: hp_oidc
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security: []
      summary: Single sign-on callback (redirect target registered with the identity provider)
      tags:
        - Session
      x-permission: public
  /auth/oidc/{slug}/link:
    post:
      operationId: oidc-link-start
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: return_to
          schema:
            maxLength: 512
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkOutBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Link an SSO identity to my account (returns the provider URL)
      tags:
        - Session
      x-permission: session
  /auth/oidc/{slug}/start:
    get:
      operationId: oidc-start
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: return_to
          schema:
            maxLength: 512
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security: []
      summary: Start single sign-on (redirects to the identity provider)
      tags:
        - Session
      x-permission: public
  /auth/recover:
    post:
      operationId: recover
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDTO"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security: []
      summary: Sign in with a break-glass recovery token
      tags:
        - Session
      x-permission: public
  /auth/settings:
    get:
      operationId: get-auth-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettingsDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Get authentication settings
      tags:
        - Single sign-on
      x-permission: auth.settings
    put:
      operationId: replace-auth-settings
      parameters:
        - in: header
          name: If-Match
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSettingsDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettingsDTO"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Replace authentication settings
      tags:
        - Single sign-on
      x-permission: auth.settings
  /auth/setup:
    post:
      operationId: complete-setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDTO"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security: []
      summary: Create the first administrator with a one-time setup token
      tags:
        - Session
      x-permission: public
  /budgets:
    get:
      operationId: list-budgets
      parameters:
        - description: Opaque cursor from a previous page's next_cursor.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous page's next_cursor.
            type: string
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResourceBudgetSpec"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: List Budgets
      tags:
        - Budgets
      x-permission: config.read
    post:
